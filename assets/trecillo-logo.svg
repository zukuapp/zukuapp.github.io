<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Trecillo Company Wordmark - Dark Background -->
  <defs>
    <linearGradient id="trecilloGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CCCCCC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trecilloAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC008C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background (transparent for overlay use) -->
  <rect width="800" height="200" fill="none"/>

  <!-- TRECILLO Wordmark -->
  <text
    x="400" y="120"
    text-anchor="middle"
    font-family="'Syne', 'Inter', 'Pretendard', -apple-system, sans-serif"
    font-size="96"
    font-weight="800"
    fill="url(#trecilloGradient)"
    letter-spacing="8"
    font-feature-settings="'ss01' 1, 'cv01' 1"
  >TRECILLO</text>

  <!-- Registered symbol -->
  <text
    x="630" y="70"
    text-anchor="middle"
    font-family="'Syne', 'Inter', 'Pretendard', -apple-system, sans-serif"
    font-size="20"
    font-weight="700"
    fill="#FFFFFF"
    opacity="0.6"
  >®</text>

  <!-- Accent underline -->
  <path
    d="M 180 135 Q 400 155 620 135"
    stroke="url(#trecilloAccentGradient)"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
  />
</svg>